schema_version: 1

context:
  name: lunardate
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lunardate-${{ version }}.tar.gz
  sha256: 5ebf790457a22829b7df6b742232d5d38fe7d0daf85683b804131e73a0e06efc

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - lunardate
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A Chinese Calendar Library in Pure Python
  license: GPL-3.0-only
  license_file: LICENSE.txt
  homepage: https://github.com/lidaobing/python-lunardate

extra:
  recipe-maintainers:
    - bletham
    - thewchan
